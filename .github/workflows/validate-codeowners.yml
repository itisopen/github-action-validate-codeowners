name: "validate-codeowners"
on:
  pull_request_target:
  workflow_dispatch:

jobs:
  validate-codeowners:
    # For development reasons, this action is pinned to the `main` branch.
    # However, we recommend that you choose a specific release to pin to.
    # Consult https://github.com/itisopen/github-action-validate-codeowners/releases for a list of available releases.
    uses: itisopen/github-action-validate-codeowners/.github/workflows/validate-codeowners-reusable.yml@itisopen
    secrets:
      token: ${{ secrets.CODEOWNERS_VALIDATOR_TOKEN_PUBLIC }}
